name: novamercado

x-airflow: &airflow
  image: novamercado-airflow:3.3.2
  build:
    context: .
    dockerfile: airflow/Dockerfile
  user: "${AIRFLOW_UID:-50000}:0"
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "postgresql+psycopg2://${AIRFLOW_DB_USER:?}:${AIRFLOW_DB_PASSWORD:?}@airflow-db:5432/${AIRFLOW_DB:?}"
    AIRFLOW__CORE__FERNET_KEY: "${AIRFLOW_FERNET_KEY:?}"
    AIRFLOW__API__SECRET_KEY: "${AIRFLOW_SECRET_KEY:?}"
    AIRFLOW__API_AUTH__JWT_SECRET: "${AIRFLOW_SECRET_KEY:?}"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: "${AIRFLOW_ADMIN_USER:?}:admin"
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/auth/passwords.json
    MLFLOW_TRACKING_URI: http://mlflow:5000
    PRODUCT_DB_HOST: product-db
    PRODUCT_DB_NAME: "${PRODUCT_DB:?}"
    PRODUCT_DB_USER: "${PRODUCT_DB_USER:?}"
    PRODUCT_DB_PASSWORD: "${PRODUCT_DB_PASSWORD:?}"
    DATA_DIR: /data
    MODEL_NAME: ${MODEL_NAME:-novamercado-histgradientboosting}
    RETRAIN_WORK_DIR: /opt/airflow/work
    MLFLOW_HTTP_REQUEST_TIMEOUT: ${MLFLOW_HTTP_REQUEST_TIMEOUT:-3}
    MLFLOW_HTTP_REQUEST_MAX_RETRIES: ${MLFLOW_HTTP_REQUEST_MAX_RETRIES:-0}
  volumes:
    - ./airflow/dags:/opt/airflow/dags:ro
    - airflow-logs:/opt/airflow/logs
    - airflow-work:/opt/airflow/work
    - airflow-auth:/opt/airflow/auth
    - type: bind
      source: ${DATA_DIR:-./data}
      target: /data
      read_only: true
      bind:
        create_host_path: false

services:
  product-db:
    image: postgres:16.8-bookworm
    environment:
      POSTGRES_DB: "${PRODUCT_DB:?}"
      POSTGRES_USER: "${PRODUCT_DB_USER:?}"
      POSTGRES_PASSWORD: "${PRODUCT_DB_PASSWORD:?}"
    volumes:
      - product-db:/var/lib/postgresql/data
      - ./app/db/esquema.sql:/docker-entrypoint-initdb.d/001-producto.sql:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 10

  airflow-db:
    image: postgres:16.8-bookworm
    environment:
      POSTGRES_DB: "${AIRFLOW_DB:?}"
      POSTGRES_USER: "${AIRFLOW_DB_USER:?}"
      POSTGRES_PASSWORD: "${AIRFLOW_DB_PASSWORD:?}"
    volumes:
      - airflow-db:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 10

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.17.2
    command:
      - mlflow
      - server
      - --host=0.0.0.0
      - --port=5000
      - --allowed-hosts=mlflow:5000,localhost:5000,127.0.0.1:5000,localhost:${MLFLOW_PORT:-5001},127.0.0.1:${MLFLOW_PORT:-5001}
      - --backend-store-uri=sqlite:////mlflow/metadata/mlflow.db
      - --serve-artifacts
      - --artifacts-destination=/mlflow/artifacts
    ports:
      - "127.0.0.1:${MLFLOW_PORT:-5001}:5000"
    volumes:
      - mlflow-metadata:/mlflow/metadata
      - mlflow-artifacts:/mlflow/artifacts
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 10

  airflow-init:
    <<: *airflow
    environment:
      <<: *airflow-env
      AIRFLOW_ADMIN_USER: "${AIRFLOW_ADMIN_USER:?}"
      AIRFLOW_ADMIN_PASSWORD: "${AIRFLOW_ADMIN_PASSWORD:?}"
    command: [bash, -c, "airflow db migrate && python /opt/novamercado/airflow/inicializar_auth.py"]
    depends_on:
      airflow-db:
        condition: service_healthy

  airflow-apiserver:
    <<: *airflow
    command: api-server
    ports:
      - "127.0.0.1:${AIRFLOW_PORT:-8080}:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/v2/monitor/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 10

  airflow-scheduler:
    <<: *airflow
    command: scheduler
    depends_on:
      airflow-apiserver:
        condition: service_healthy
      airflow-dag-processor:
        condition: service_started
    healthcheck:
      test: [CMD-SHELL, 'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5

  airflow-dag-processor:
    <<: *airflow
    command: dag-processor
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  product-init: &product
    image: novamercado-api:1.0.0
    build:
      context: .
      dockerfile: Dockerfile
    command: [python, -m, app.bootstrap]
    environment:
      PRODUCT_DB_HOST: product-db
      PRODUCT_DB_NAME: "${PRODUCT_DB:?}"
      PRODUCT_DB_USER: "${PRODUCT_DB_USER:?}"
      PRODUCT_DB_PASSWORD: "${PRODUCT_DB_PASSWORD:?}"
      MLFLOW_TRACKING_URI: http://mlflow:5000
      AIRFLOW_BASE_URL: http://airflow-apiserver:8080
      AIRFLOW_USER: "${AIRFLOW_ADMIN_USER:?}"
      AIRFLOW_PASSWORD: "${AIRFLOW_ADMIN_PASSWORD:?}"
      DATA_DIR: /data
      MODEL_CACHE_DIR: /models
      MODEL_NAME: ${MODEL_NAME:-novamercado-histgradientboosting}
      MODEL_REFRESH_SECONDS: ${MODEL_REFRESH_SECONDS:-30}
      MLFLOW_HTTP_REQUEST_TIMEOUT: ${MLFLOW_HTTP_REQUEST_TIMEOUT:-3}
      MLFLOW_HTTP_REQUEST_MAX_RETRIES: ${MLFLOW_HTTP_REQUEST_MAX_RETRIES:-0}
    volumes:
      - model-cache:/models
      - type: bind
        source: ${DATA_DIR:-./data}
        target: /data
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      product-db:
        condition: service_healthy
      mlflow:
        condition: service_healthy

  api:
    <<: *product
    command: [uvicorn, app.main:app, --host, 0.0.0.0, --port, "8000"]
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      product-init:
        condition: service_completed_successfully
      airflow-apiserver:
        condition: service_healthy
      airflow-scheduler:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import json,urllib.request; r=json.load(urllib.request.urlopen('http://localhost:8000/health', timeout=12)); assert r['estado']=='ok'"]
      interval: 10s
      timeout: 15s
      retries: 60
      start_period: 10s

volumes:
  product-db:
  airflow-db:
  mlflow-metadata:
  mlflow-artifacts:
  airflow-logs:
  airflow-work:
  airflow-auth:
  model-cache:
